[project]
name = "dgp-quality-scoring"
version = "0.1.0"
description = "Data-generating process and quality scoring for synthetic tabular cohorts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.10",
    "sdv>=1.32.1",
    "synthcity>=0.2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
